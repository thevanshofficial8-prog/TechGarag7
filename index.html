<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGarag7</title>
    <!-- Official Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        /* 🌈 Animated RGB Background */
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0d001a, #1f0033, #001a33, #00261c, #26001a);
            background-size: 400% 400%;
            animation: rgbBackground 12s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes rgbBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ✨ Interactive Canvas Background */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 🚀 Welcome Splash Screen */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease, visibility 1s;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(45deg, #ff0055, #00e5ff, #00ff66);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% { filter: drop-shadow(0 0 5px rgba(255,0,85,0.8)); }
            100% { filter: drop-shadow(0 0 15px rgba(0,229,255,0.8)); }
        }

        /* 📦 Main Card */
        .main-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 650px;
            margin: 25px auto;
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* 📢 Fixed Announcement Banner */
        .notice-bar {
            width: 100%;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #00e5ff;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            position: relative;
        }

        .notice-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* 🎬 Video Container */
        .video-box {
            width: 100%;
            border-radius: 18px;
            padding: 4px;
            background: linear-gradient(45deg, #ff0000, #00ff88, #00a2ff, #ff00d4);
            background-size: 300% 300%;
            animation: rgbGlow 5s linear infinite;
            box-shadow: 0 0 20px rgba(0, 225, 255, 0.3);
        }

        @keyframes rgbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .video-box video {
            width: 100%;
            display: block;
            border-radius: 14px;
            background-color: #000;
            max-height: 450px;
            object-fit: cover;
        }

        /* 👤 Info Box */
        .info-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ✨ TechGarag7 Title */
        .user-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff0055, #00e5ff, #00ff66, #ff00d4);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonShimmer 3s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @keyframes neonShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🔵 SVG Verified Blue Tick */
        .verified-badge {
            width: 26px;
            height: 26px;
            display: inline-flex;
            filter: drop-shadow(0 0 6px rgba(0, 149, 246, 0.9));
        }

        .stats-row {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            color: #00e5ff;
            font-weight: 600;
            flex-wrap: wrap;
            justify-content: center;
        }

        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 102, 0.12);
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .green-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* 🛠️ Action Pill Buttons */
        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 5px;
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pill-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: #00e5ff;
            color: #00e5ff;
        }

        /* 📲 Social Links */
        .social-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-telegram {
            background: linear-gradient(135deg, #229ED9, #0088cc);
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.4);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4);
        }

        .btn-link:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }

        /* 🏆 Verified Badge Box */
        .authenticity-badge {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
        }

        /* 💥 Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.6);
            transform: scale(0);
            animation: ripple-effect 0.5s linear;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to { transform: scale(4); opacity: 0; }
        }

        footer {
            position: relative;
            z-index: 2;
            padding: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 🌟 Stars Background -->
    <canvas id="stars-canvas"></canvas>

    <!-- 🚀 Welcome Intro -->
    <div id="welcome-screen">
        <h1 class="welcome-title">Welcome to TechGarag7</h1>
    </div>

    <!-- 📦 Main Card -->
    <div class="main-card">
        
        <!-- 📢 Scrolling Notice Bar -->
        <div class="notice-bar">
            <span class="notice-text">🔥 Welcome to TechGarag7 Official Page • Daily Tech Updates, Premium Links & Mods! 🔥</span>
        </div>

        <!-- 🎬 Loop Video Box -->
        <div class="video-box">
            <video autoplay loop muted playsinline controls>
                <source src="video (1).mp4" type="video/mp4">
                <source src="video%20(1).mp4" type="video/mp4">
                <source src="video.mp4" type="video/mp4">
                Your browser does not support video tag.
            </video>
        </div>

        <!-- 👤 Details Block -->
        <div class="info-section">
            <div class="user-title">
                TechGarag7
                <span class="verified-badge">
                    <svg viewBox="0 0 24 24" fill="#0095f6" width="100%" height="100%">
                        <path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.79-4-4-4-.495 0-.965.084-1.4.238C14.55 2.475 13.18 1.6 11.6 1.6c-1.58 0-2.95.875-3.6 2.148-.435-.154-.905-.238-1.4-.238-2.21 0-4 1.79-4 4 0 .495.084.965.238 1.4C1.575 9.55.7 10.92.7 12.5c0 1.58.875 2.95 2.148 3.6-.154.435-.238.905-.238 1.4 0 2.21 1.79 4 4 4 .495 0 .965-.084 1.4-.238 1.07 1.273 2.44 2.148 4.02 2.148 1.58 0 2.95-.875 3.6-2.148.435.154.905.238 1.4.238 2.21 0 4-1.79 4-4 0-.495-.084-.965-.238-1.4 1.273-1.07 2.148-2.44 2.148-4.02zM10.09 16.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z" fill="#0095f6"/>
                        <path d="M10.09 15.24l-2.32-2.33-1.48 1.48 3.8 3.81 7.33-7.35-1.48-1.48z" fill="#ffffff"/>
                    </svg>
                </span>
            </div>

            <div class="stats-row">
                <span><i class="fa-solid fa-eye"></i> Views: <span id="view-counter">5,374</span></span>
                <span>• Ping: <span style="color:#00ff66;">12ms</span></span>
            </div>

            <div class="action-row">
                <div class="online-badge">
                    <span class="green-dot"></span> <span id="active-users">28</span> Online
                </div>
                <button class="pill-btn" onclick="copyTelegramTag()">
                    <i class="fa-regular fa-copy"></i> <span id="copy-btn-text">Copy TG</span>
                </button>
                <button class="pill-btn" onclick="shareWebsite()">
                    <i class="fa-solid fa-share-nodes"></i> Share
                </button>
            </div>
        </div>

        <!-- 📲 Social Links -->
        <div class="social-container">
            <a href="https://t.me/+FkAldel92nMxZWU9" target="_blank" class="btn-link btn-telegram" onclick="playTapSound()">
                <i class="fa-brands fa-telegram"></i> Telegram Channel
            </a>
            <a href="https://www.instagram.com/techgarag7?igsh=em16enh6enNkOXlj" target="_blank" class="btn-link btn-instagram" onclick="playTapSound()">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
        </div>

        <div class="authenticity-badge">
            <i class="fa-solid fa-shield-halved" style="color:#00ff66;"></i> 100% Official & Verified TechGarag7 Page
        </div>

    </div>

    <!-- © Copyright 2026 -->
    <footer>
        © 2026 TechGarag7 • All Rights Reserved
    </footer>

    <script>
        // Splash Screen
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('welcome-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 1000);
            }, 3000);
        });

        // Views & Online Counter Simulation
        let currentViews = 5374;
        const viewCounter = document.getElementById('view-counter');
        const activeUsers = document.getElementById('active-users');

        setInterval(() => {
            currentViews += Math.floor(Math.random() * 2) + 1;
            viewCounter.textContent = currentViews.toLocaleString();
        }, 1200);

        setInterval(() => {
            activeUsers.textContent = Math.floor(Math.random() * 15) + 20;
        }, 3000);

        // Copy TG Link
        function copyTelegramTag() {
            playTapSound();
            navigator.clipboard.writeText("https://t.me/+FkAldel92nMxZWU9");
            const btnText = document.getElementById('copy-btn-text');
            btnText.textContent = "Copied! ✅";
            setTimeout(() => btnText.textContent = "Copy TG", 2000);
        }

        // Web Share API
        function shareWebsite() {
            playTapSound();
            if (navigator.share) {
                navigator.share({
                    title: 'TechGarag7 Official',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Site link copied to clipboard!");
            }
        }

        // Futuristic Web Audio Beep Sound
        function playTapSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        // Dynamic Interactive Canvas Stars
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let mouse = { x: null, y: null };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', (e) => { 
            mouse.x = e.touches[0].clientX; 
            mouse.y = e.touches[0].clientY; 
        });

        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 229, 255, ${star.alpha})`;
                ctx.fill();

                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

                // Mouse interaction
                if (mouse.x && mouse.y) {
                    let dx = mouse.x - star.x;
                    let dy = mouse.y - star.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 80) {
                        ctx.beginPath();
                        ctx.moveTo(star.x, star.y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.strokeStyle = `rgba(0, 229, 255, ${1 - dist/80})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // Neon Ripple Effect
        document.addEventListener('click', function (e) {
            let circle = document.createElement('div');
            circle.classList.add('ripple');
            circle.style.left = e.clientX + 'px';
            circle.style.top = e.clientY + 'px';
            document.body.appendChild(circle);
            setTimeout(() => circle.remove(), 500);
        });
    </script>

</body>
</html>
