<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGarag7</title>
    <!-- Official Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 🌈 Animated RGB Background */
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0d001a, #1f0033, #001a33, #00261c, #26001a);
            background-size: 400% 400%;
            animation: rgbBackground 12s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        @keyframes rgbBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🚀 Welcome Splash Screen (3.5 Secs) */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease, visibility 1s;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(45deg, #ff0055, #00e5ff, #00ff66);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% { filter: drop-shadow(0 0 5px rgba(255,0,85,0.8)); }
            100% { filter: drop-shadow(0 0 15px rgba(0,229,255,0.8)); }
        }

        /* 📦 Main Layout Container */
        .main-card {
            width: 90%;
            max-width: 650px;
            margin: 25px auto;
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 🎬 Big Loop Video Container with RGB Glow Frame */
        .video-box {
            width: 100%;
            border-radius: 18px;
            padding: 4px;
            background: linear-gradient(45deg, #ff0000, #00ff88, #00a2ff, #ff00d4);
            background-size: 300% 300%;
            animation: rgbGlow 5s linear infinite;
            box-shadow: 0 0 20px rgba(0, 225, 255, 0.3);
        }

        @keyframes rgbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .video-box video {
            width: 100%;
            display: block;
            border-radius: 14px;
            background-color: #000;
            max-height: 450px;
            object-fit: cover;
        }

        /* 👤 Info Box */
        .info-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ✨ TechGarag7 🔥 Clean RGB Neon Title */
        .user-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff0055, #00e5ff, #00ff66, #ff00d4);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonShimmer 3s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 5px 0;
        }

        @keyframes neonShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🔵 Pure SVG Instagram Blue Tick */
        .verified-badge {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 6px rgba(0, 149, 246, 0.9));
        }

        .views-count {
            font-size: 1.1rem;
            color: #00e5ff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 102, 0.12);
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .green-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* 📲 Social Media Buttons */
        .social-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .btn-link i {
            font-size: 1.4rem;
        }

        .btn-telegram {
            background: linear-gradient(135deg, #229ED9, #0088cc);
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.4);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4);
        }

        .btn-link:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }

        footer {
            padding: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
