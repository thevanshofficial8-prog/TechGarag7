<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGarag7 - VIP Portal</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            color: #ffffff;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.3);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 relative">

    <!-- Starry Background Canvas -->
    <canvas id="stars-canvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

    <!-- Top Bar -->
    <div class="w-full max-w-md flex justify-between items-center z-10 mb-4">
        <div class="glass-card px-4 py-2 rounded-full text-xs font-semibold tracking-wider text-pink-400 border border-pink-500/30 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span> Links & Mods! 🔥
        </div>
        <!-- Theme Palette & Game Trigger -->
        <div class="flex gap-2">
            <button onclick="openMiniGame()" class="glass-card w-10 h-10 rounded-full flex items-center justify-center text-cyan-400 hover:scale-110 transition shadow-lg">
                <i class="fa-solid fa-gamepad"></i>
            </button>
            <button onclick="triggerConfetti()" class="glass-card w-10 h-10 rounded-full flex items-center justify-center text-pink-500 hover:scale-110 transition shadow-lg">
                <i class="fa-solid fa-palette"></i>
            </button>
        </div>
    </div>

    <!-- Main Profile / Card Container -->
    <div class="w-full max-w-md glass-card rounded-3xl p-6 relative z-10 neon-glow flex flex-col items-center gap-6">
        
        <!-- Welcome Banner -->
        <div class="w-full bg-gradient-to-r from-purple-900/50 to-pink-900/50 rounded-2xl p-4 border border-white/10 text-center floating">
            <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 p-1 mb-3 shadow-lg">
                <div class="w-full h-full bg-gray-900 rounded-xl flex items-center justify-center text-3xl font-extrabold text-white">
                    ₹
                </div>
            </div>
            <h2 class="text-xl font-bold tracking-wide">FAKÉ Pay</h2>
            <p class="text-xs text-gray-400 mt-1">Welcome to TechGarag7 Secure Hub</p>
        </div>

        <!-- Channel Info & Stats -->
        <div class="w-full text-center">
            <h1 class="text-2xl font-black flex items-center justify-center gap-2">
                TechGarag7 <i class="fa-solid fa-circle-check text-blue-400 text-lg"></i>
            </h1>
            <div class="flex justify-center items-center gap-4 mt-3 text-xs text-gray-400">
                <span class="flex items-center gap-1"><i class="fa-solid fa-eye text-pink-500"></i> Views: <strong id="view-count" class="text-white">5,450</strong></span>
                <span>•</span>
                <span class="flex items-center gap-1"><i class="fa-solid fa-signal text-emerald-400"></i> Ping: <strong class="text-white">12ms</strong></span>
            </div>
            
            <div class="flex justify-center items-center gap-4 mt-3">
                <div class="glass-card px-3 py-1 rounded-full text-xs font-semibold text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> <span id="online-users">28</span> Online
                </div>
                <button onclick="copyTelegramLink()" class="glass-card px-3 py-1 rounded-full text-xs font-semibold text-gray-300 hover:text-white transition flex items-center gap-1.5 border border-white/10">
                    <i class="fa-regular fa-copy"></i> Copy TG
                </button>
            </div>

            <!-- Like & Heart Button -->
            <button onclick="addLike()" class="mt-4 w-full py-2 bg-pink-600/20 hover:bg-pink-600/40 border border-pink-500/40 rounded-xl text-xs font-bold text-pink-300 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-heart text-pink-500 animate-bounce"></i> Tap to Love (<span id="like-counter">1,240</span>)
            </button>
        </div>

        <!-- Action Buttons -->
        <div class="w-full flex flex-col gap-3">
            <a href="https://t.me/" target="_blank" onclick="playTapSound(); triggerConfetti();" class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-2xl font-bold text-center text-sm shadow-lg shadow-blue-500/30 hover:scale-[1.02] transition flex items-center justify-center gap-2">
                <i class="fa-brands fa-telegram text-lg"></i> Telegram Channel
            </a>
            <a href="https://instagram.com/" target="_blank" onclick="playTapSound(); triggerConfetti();" class="w-full py-3.5 px-4 bg-gradient-to-r from-purple-600 via-pink-600 to-orange-500 rounded-2xl font-bold text-center text-sm shadow-lg shadow-pink-500/30 hover:scale-[1.02] transition flex items-center justify-center gap-2">
                <i class="fa-brands fa-instagram text-lg"></i> Instagram
            </a>
            <!-- Daily Mystery Reward Button -->
            <button onclick="openMysteryReward()" class="w-full py-3 px-4 glass-card rounded-2xl font-semibold text-center text-xs text-yellow-400 border border-yellow-500/30 hover:bg-yellow-500/10 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-gift"></i> Claim Daily VIP Mystery Box 🎁
            </button>
        </div>
    </div>

    <!-- Floating AI Chatbot Button -->
    <div class="fixed bottom-6 right-6 z-30">
        <button onclick="toggleChatbot()" class="w-14 h-14 rounded-full bg-gradient-to-tr from-emerald-500 to-cyan-400 flex items-center justify-center text-gray-900 text-2xl shadow-xl hover:scale-110 transition neon-glow relative">
            <i class="fa-solid fa-robot"></i>
            <span class="absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-gray-900"></span>
        </button>
    </div>

    <!-- AI Chatbot Drawer Modal -->
    <div id="chat-modal" class="fixed inset-x-0 bottom-0 max-w-md mx-auto glass-card rounded-t-3xl p-4 z-40 transform translate-y-full transition-transform duration-300 border-t border-white/20 shadow-2xl hidden">
        <div class="flex justify-between items-center mb-3 pb-2 border-b border-white/10">
            <span class="font-bold text-sm text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-microchip"></i> TechGarag7 AI Bot</span>
            <button onclick="toggleChatbot()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div id="chat-body" class="h-48 overflow-y-auto flex flex-col gap-2 text-xs text-gray-300 p-1">
            <div class="bg-gray-800/80 p-2.5 rounded-xl max-w-[85%]">Hello Vansh! 👋 How can I help you with mods or links today?</div>
        </div>
        <div class="mt-3 flex gap-2">
            <input type="text" id="chat-input" placeholder="Ask anything..." class="flex-1 bg-gray-900/80 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
            <button onclick="sendChatMessage()" class="bg-cyan-500 hover:bg-cyan-400 text-gray-900 px-4 py-2 rounded-xl text-xs font-bold transition"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-4 text-[10px] text-gray-500 z-10">
        © 2026 TechGarag7 • All Rights Reserved. Crafted with ❤️ for Vansh.
    </footer>

    <!-- JavaScript Automation & Features -->
    <script>
        // Starry Background Animation
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 1.5, alpha: Math.random(), speed: Math.random() * 0.02 });
        }
        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 229, 255, ${star.alpha})`;
                ctx.fill();
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // Audio Tap Sound
        function playTapSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        // Confetti Burst FX
        function triggerConfetti() {
            playTapSound();
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.8 } });
        }

        // Like Counter System
        let likeCount = 1240;
        function addLike() {
            likeCount++;
            document.getElementById('like-counter').innerText = likeCount.toLocaleString();
            triggerConfetti();
        }

        // Copy Link Notification
        function copyTelegramLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("✨ VIP Link Copied to Clipboard!");
            playTapSound();
        }

        // Daily Mystery Reward Popup
        function openMysteryReward() {
            playTapSound();
            alert("🎁 Daily Mystery Box Unlocked!\n🔥 Bonus VIP Mod Key: TG7-VIP-8899\nUse this in our Telegram channel!");
            triggerConfetti();
        }

        // Mini Game Popup
        function openMiniGame() {
            playTapSound();
            let score = Math.floor(Math.random() * 500) + 100;
            alert(`🕹️ Cyber Arcade Runner:\nYou played the mini-game and scored ${score} points! Share your high score on Telegram! 🚀`);
        }

        // AI Chatbot Toggle & Logic
        function toggleChatbot() {
            playTapSound();
            const modal = document.getElementById('chat-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('translate-y-full');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const body = document.getElementById('chat-body');
            const text = input.value.trim();
            if(!text) return;

            playTapSound();
            body.innerHTML += `<div class="bg-cyan-900/60 p-2 rounded-xl max-w-[85%] self-end text-white text-right">${text}</div>`;
            input.value = '';
            body.scrollTop = body.scrollHeight;

            setTimeout(() => {
                let reply = "That's awesome Vansh! Check out our Telegram channel for fresh updates. 🔥";
                const lower = text.toLowerCase();
                if(lower.includes("mod") || lower.includes("apk")) reply = "All latest verified mods are posted directly on our official Telegram channel!";
                else if(lower.includes("owner") || lower.includes("creator")) reply = "Created with passion by Vansh (TechGarag7)! 🚀";
                
                body.innerHTML += `<div class="bg-gray-800/80 p-2.5 rounded-xl max-w-[85%]">${reply}</div>`;
                body.scrollTop = body.scrollHeight;
                playTapSound();
            }, 600);
        }

        // Auto greeting notification on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log("TechGarag7 VIP Hub Loaded Successfully!");
            }, 1000);
        });
    </script>
</body>
</html>
